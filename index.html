<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cercado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
  <style>
    :root {
      --board: #e7ebf3;
      --grid: #d7ddea;
      --wall: #2a3348;
      --ink: #141a2a;
      --muted: #596177;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-line: rgba(20, 26, 42, 0.12);
      --scrim: rgba(231, 235, 243, 0.55);
      --halo: rgba(231, 235, 243, 0.92);
      --field: #ffffff;
      --accent: #2f6bff;
      --accent-ink: #ffffff;
      --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
      --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --board: #1a2033;
        --grid: #232b42;
        --wall: #0b0e18;
        --ink: #eef1f8;
        --muted: #9aa4bd;
        --panel: rgba(22, 27, 43, 0.84);
        --panel-line: rgba(255, 255, 255, 0.1);
        --scrim: rgba(8, 10, 18, 0.5);
        --halo: rgba(26, 32, 51, 0.9);
        --field: #10152a;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --board: #1a2033;
      --grid: #232b42;
      --wall: #0b0e18;
      --ink: #eef1f8;
      --muted: #9aa4bd;
      --panel: rgba(22, 27, 43, 0.84);
      --panel-line: rgba(255, 255, 255, 0.1);
      --scrim: rgba(8, 10, 18, 0.5);
      --halo: rgba(26, 32, 51, 0.9);
      --field: #10152a;
      color-scheme: dark;
    }

    html, body { height: 100%; }
    body {
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      background: var(--wall);
      color: var(--ink);
      font-family: var(--body);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
    }

    #cv {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      z-index: 0;
    }

    .hud {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-top: 12px;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 14px;
      padding: 10px 14px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      min-width: 0;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat .big {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(22px, 6vw, 30px);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .stat .sub {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .lb {
      width: min(190px, 46vw);
    }

    .lb ol {
      list-style: none;
      margin: 6px 0 0;
      padding: 0;
      display: grid;
      gap: 4px;
    }

    .lb li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
    }

    .lb li i {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .lb li .nm {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lb li b {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .lb li.me {
      color: var(--accent);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: var(--scrim);
      padding-block: 16px;
      overflow-y: auto;
    }

    .card {
      box-sizing: border-box;
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 22px;
      padding: 24px;
      display: grid;
      gap: 14px;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      user-select: auto;
      -webkit-user-select: auto;
    }

    .card h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(36px, 11vw, 48px);
      line-height: 1;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .card h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(26px, 8vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      color: var(--muted);
      max-width: 52ch;
    }

    .card p.lead {
      color: var(--ink);
      font-weight: 600;
      font-size: 16px;
    }

    .card .hint {
      font-size: 13px;
    }

    #demo {
      display: block;
      width: 100%;
      max-width: 230px;
      height: auto;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field input {
      box-sizing: border-box;
      width: 100%;
      font: 600 16px var(--body);
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--panel-line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .btn {
      font: 700 16px var(--body);
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      width: 100%;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--panel-line);
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stats div {
      background: var(--field);
      border: 1px solid var(--panel-line);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 0;
    }
