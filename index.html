<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Paper.io Real-Time Bet Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #121216;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #painel {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: #181824;
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
        }
        .destaque { color: #00ffcc; font-weight: bold; }
        .pote { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="painel">
        <div>ID: <span id="meuId" class="destaque">-</span></div>
        <div>Seu Saldo: <span id="saldo" class="destaque">R\$ 0,00</span></div>
        <div>💰 POTE ATUAL: <span id="pote" class="pote">R\$ 0,00</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const local = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const wsUrl = local 
            ? 'ws://localhost:8080' 
            : window.location.origin.replace(/^http/, 'ws');
        
        const ws = new WebSocket(wsUrl);
        
        let meuId = null;
        let servidoresDados = { players: {}, pot: 0 };
        let renderDados = { players: {} }; // Guarda posições interpoladas (suaves)

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'init') {
                meuId = data.id;
                document.getElementById('meuId').innerText = meuId;
                document.getElementById('saldo').innerText = `R$ ${data.balance.toFixed(2)}`;
            }

            if (data.type === 'update') {
                servidoresDados = data.gameState;
                document.getElementById('pote').innerText = `R$ ${servidoresDados.pot.toFixed(2)}`;
            }
        };

        // LOOP DE RENDERIZAÇÃO PROFISSIONAL (60 FPS)
        function gameLoop() {
            // Atualiza posições visuais suavizadas (Interpolação)
            Object.keys(servidoresDados.players).forEach(id => {
                const sPlayer = servidoresDados.players[id];
                
                if (!renderDados.players[id]) {
                    renderDados.players[id] = { ...sPlayer };
                } else {
                    const rPlayer = renderDados.players[id];
                    // Move o elemento visual 20% mais perto da posição real do servidor a cada frame
                    rPlayer.x += (sPlayer.x - rPlayer.x) * 0.22;
                    rPlayer.y += (sPlayer.y - rPlayer.y) * 0.22;
                    rPlayer.color = sPlayer.color;
                    rPlayer.trail = sPlayer.trail;
                    rPlayer.alive = sPlayer.alive;
                }
            });

            // Limpa dados de quem desconectou
            Object.keys(renderDados.players).forEach(id => {
                if (!servidoresDados.players[id]) delete renderDados.players[id];
            });

            desenharJogo();
            requestAnimationFrame(gameLoop);
        }

        function desenharJogo() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha uma grade de fundo sutil para dar noção de movimento
            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Desenha os jogadores suavizados
            Object.values(renderDados.players).forEach(player => {
                if (!player.alive) return;

                // 1. Desenha a trilha neon com efeito de brilho
                if (player.trail.length > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = player.color;
                    ctx.lineWidth = 8;
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = player.color;

                    player.trail.forEach((ponto, index) => {
                        if (index === 0) ctx.moveTo(ponto.x, ponto.y);
                        else ctx.lineTo(ponto.x, ponto.y);
                    });
                    ctx.stroke();
                    ctx.shadowBlur = 0; // Reseta o blur para o resto
                }

                // 2. Desenha o quadrado principal
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.roundRect(player.x - 10, player.y - 10, 20, 20, 4); // Quadrado levemente arredondado
                ctx.fill();

                // Destaca o seu próprio personagem com uma borda neon branca
                if (player.id === meuId) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ffffff';
                    ctx.beginPath();
                    ctx.roundRect(player.x - 12, player.y - 12, 24, 24, 6);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });
        }

        // Captura comandos de movimento instantâneos
        window.addEventListener('keydown', (e) => {
            let dx = 0, dy = 0;
            if (e.key === 'ArrowUp' || e.key === 'w')    { dx = 0;  dy = -1; }
            if (e.key === 'ArrowDown' || e.key === 's')  { dx = 0;  dy = 1;  }
            if (e.key === 'ArrowLeft' || e.key === 'a')  { dx = -1; dy = 0;  }
            if (e.key === 'ArrowRight' || e.key === 'd') { dx = 1;  dy = 0;  }

            if (dx !== 0 || dy !== 0) {
                ws.send(JSON.stringify({ type: 'move', dx, dy }));
            }
        });

        // Inicializa o motor visual do navegador
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
