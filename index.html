<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper.io - Território & Explosões</title>
    <style>
        body {
            margin: 0;
            background-color: #0c0c0e;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #painel {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 14px;
            background: rgba(12, 12, 14, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .destaque { color: #00ffcc; font-weight: bold; }
        .pote { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="painel">
        <div>ID: <span id="meuId" class="destaque">-</span></div>
        <div>Saldo: <span id="saldo" class="destaque">R\$ 0,00</span></div>
        <div>💰 POTE: <span id="pote" class="pote">R\$ 0,00</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function redimensionarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionarCanvas);
        redimensionarCanvas();

        const local = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const wsUrl = local ? 'ws://localhost:8080' : window.location.origin.replace(/^http/, 'ws');
        const ws = new WebSocket(wsUrl);
        
        let meuId = null;
        let servidoresDados = { players: {}, pot: 0, mapSize: 3000 };
        let renderDados = { players: {} };
        let particulas = []; // 🆕 Sistema de efeitos especiais

        // 🆕 Função para gerar explosão de partículas
        function criarExplosao(x, y, cor) {
            for (let i = 0; i < 35; i++) {
                particulas.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    raio: Math.random() * 4 + 2,
                    cor: cor,
                    alfa: 1,
                    vida: Math.random() * 0.03 + 0.015
                });
            }
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'init') {
                meuId = data.id;
                document.getElementById('meuId').innerText = meuId;
                document.getElementById('saldo').innerText = `R$ ${data.balance.toFixed(2)}`;
            }
            if (data.type === 'update') {
                // Checa se alguém morreu para ativar o efeito especial antes de atualizar os dados
                Object.keys(servidoresDados.players).forEach(id => {
                    if (servidoresDados.players[id].alive && !data.gameState.players[id]?.alive) {
                        const defunto = servidoresDados.players[id];
                        criarExplosao(defunto.x, defunto.y, defunto.color);
                    }
                });
                servidoresDados = data.gameState;
                document.getElementById('pote').innerText = `R$ ${servidoresDados.pot.toFixed(2)}`;
            }
            if (data.type === 'gameOver' && data.id === meuId) {
                alert("💥 Você foi eliminado!");
                location.reload();
            }
        };

        function gameLoop() {
            Object.keys(servidoresDados.players).forEach(id => {
                const sPlayer = servidoresDados.players[id];
                if (!renderDados.players[id]) {
                    renderDados.players[id] = { ...sPlayer };
                } else {
                    const rPlayer = renderDados.players[id];
                    rPlayer.x += (sPlayer.x - rPlayer.x) * 0.18;
                    rPlayer.y += (sPlayer.y - rPlayer.y) * 0.18;
                    rPlayer.color = sPlayer.color;
                    rPlayer.trail = sPlayer.trail;
                    rPlayer.territory = sPlayer.territory; // 🆕 Atualiza território
                    rPlayer.alive = sPlayer.alive;
                }
            });

            Object.keys(renderDados.players).forEach(id => {
                if (!servidoresDados.players[id]) delete renderDados.players[id];
            });

            // 🆕 Atualiza Partículas dos efeitos especiais
            particulas.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alfa -= p.vida;
                if (p.alfa <= 0) particulas.splice(index, 1);
            });

            desenharJogo();
            requestAnimationFrame(gameLoop);
        }

        function desenharJogo() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const meuJogador = renderDados.players[meuId];
            let camX = servidoresDados.mapSize / 2 - canvas.width / 2;
            let camY = servidoresDados.mapSize / 2 - canvas.height / 2;

            if (meuJogador) {
                camX = meuJogador.x - canvas.width / 2;
                camY = meuJogador.y - canvas.height / 2;
            }

            ctx.save();
            ctx.translate(-camX, -camY);

            const MAP_SIZE = servidoresDados.mapSize || 3000;

            // Desenha o Fundo
            ctx.fillStyle = '#14141c';
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

            // Borda do Mapa
            ctx.strokeStyle = '#ff3344';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            // 🆕 1. Desenha os Territórios Conquistados (Abaixo dos jogadores)
            Object.values(renderDados.players).forEach(player => {
                if (!player.alive || !player.territory || player.territory.length < 3) return;
                
                ctx.beginPath();
                ctx.fillStyle = player.color + "33"; // 20% de opacidade para a base preenchida
                ctx.strokeStyle = player.color + "77";
                ctx.lineWidth = 4;
                
                player.territory.forEach((ponto, index) => {
                    if (index === 0) ctx.moveTo(ponto.x, ponto.y);
                    else ctx.lineTo(ponto.x, ponto.y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            // 2. Desenha os Jogadores e as Trilhas Ativas
            Object.values(renderDados.players).forEach(player => {
                if (!player.alive) return;

                // Desenha rastro ativo
                if (player.trail && player.trail.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = player.color;
                    ctx.lineWidth = 12;
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    player.trail.forEach((ponto, index) => {
                        if (index === 0) ctx.moveTo(ponto.x, ponto.y);
                        else ctx.lineTo(ponto.x, ponto.y);
                    });
                    ctx.stroke();
                }

                // Desenha quadrado físico
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x - 14, player.y - 14, 28, 28);

                if (player.id === meuId) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(player.x - 17, player.y - 17, 34, 34);
                }
            });

            // 🆕 3. Renderiza as Partículas de Explosão na Tela
            particulas.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alfa;
                ctx.fillStyle = p.cor;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            ctx.restore();
        }

        // CONTROLES DE MOVIMENTO
        window.addEventListener('keydown', (e) => {
            let dx = 0, dy = 0;
            if (e.key === 'ArrowUp' || e.key === 'w')    { dx = 0;  dy = -1; }
            if (e.key === 'ArrowDown' || e.key === 's')  { dx = 0;  dy = 1;  }
            if (e.key === 'ArrowLeft' || e.key === 'a')  { dx = -1; dy = 0;  }
            if (e.key === 'ArrowRight' || e.key === 'd') { dx = 1;  dy = 0;  }
            if (dx !== 0 || dy !== 0) EnviarMovimento(dx, dy);
        });

        let tStartX = 0, tStartY = 0;
        window.addEventListener('touchstart', (e) => {
            tStartX = e.touches[0].clientX;
            tStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const diffX = e.touches[0].clientX - tStartX;
            const diffY = e.touches[0].clientY - tStartY;
            const dist = Math.hypot(diffX, diffY);
            if (dist > 10) EnviarMovimento(diffX / dist, diffY / dist);
        }, { passive: true });

        function EnviarMovimento(dx, dy) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'move', dx, dy }));
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
