<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conquista de Território</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font: 16px system-ui, sans-serif;
    }

    main { text-align: center; padding: 20px; }
    canvas {
      display: block;
      max-width: 100%;
      border: 2px solid #40516b;
      border-radius: 8px;
      background: #172235;
    }
    button {
      margin-top: 14px;
      padding: 9px 16px;
      border: 0;
      border-radius: 6px;
      background: #57e389;
      color: #102018;
      font-weight: bold;
      cursor: pointer;
    }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Conquista de Território</h1>
    <p>Use as setas ou WASD. Feche o rastro voltando à sua área!</p>
    <canvas id="game"></canvas>
    <p id="status"></p>
    <button onclick="reiniciar()">Recomeçar</button>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.querySelector("#status");

    const tamanho = 20;
    const colunas = 36;
    const linhas = 24;

    canvas.width = colunas * tamanho;
    canvas.height = linhas * tamanho;

    let mapa, jogador, direcao, proximaDirecao, rastro, intervalo, acabou;

    function reiniciar() {
      clearInterval(intervalo);

      mapa = Array.from({ length: linhas }, () => Array(colunas).fill(0));

      // Área inicial
      for (let y = 9; y <= 14; y++) {
        for (let x = 14; x <= 21; x++) mapa[y][x] = 1;
      }

      jogador = { x: 18, y: 11 };
      direcao = { x: 1, y: 0 };
      proximaDirecao = { x: 1, y: 0 };
      rastro = [];
      acabou = false;

      statusEl.textContent = "Território: 48 quadrados";
      desenhar();
      intervalo = setInterval(passo, 115);
    }

    function mudarDirecao(dx, dy) {
      // Impede uma volta instantânea para trás
      if (dx === -direcao.x && dy === -direcao.y) return;
      proximaDirecao = { x: dx, y: dy };
    }

    document.addEventListener("keydown", (e) => {
      const tecla = e.key.toLowerCase();
      const controles = {
        arrowup: [0, -1], w: [0, -1],
        arrowdown: [0, 1], s: [0, 1],
        arrowleft: [-1, 0], a: [-1, 0],
        arrowright: [1, 0], d: [1, 0]
      };

      if (controles[tecla]) {
        e.preventDefault();
        mudarDirecao(...controles[tecla]);
      }
    });

    function passo() {
      if (acabou) return;

      direcao = proximaDirecao;
      jogador.x += direcao.x;
      jogador.y += direcao.y;

      if (
        jogador.x < 0 || jogador.x >= colunas ||
        jogador.y < 0 || jogador.y >= linhas
      ) {
        fimDeJogo();
        return;
      }

      const casa = mapa[jogador.y][jogador.x];

      // Entrar no próprio rastro encerra a partida
      if (casa === 2) {
        fimDeJogo();
        return;
      }

      if (casa === 1) {
        if (rastro.length) conquistar();
      } else {
        mapa[jogador.y][jogador.x] = 2;
        rastro.push({ x: jogador.x, y: jogador.y });
      }

      desenhar();
    }

    function conquistar() {
      // Marca o exterior: espaços vazios alcançáveis pelas bordas.
      const exterior = Array.from(
        { length: linhas },
        () => Array(colunas).fill(false)
      );
      const fila = [];

      function adicionar(x, y) {
        if (
          x >= 0 && x < colunas && y >= 0 && y < linhas &&
          !exterior[y][x] && mapa[y][x] === 0
        ) {
          exterior[y][x] = true;
          fila.push({ x, y });
        }
      }

      for (let x = 0; x < colunas; x++) {
        adicionar(x, 0);
        adicionar(x, linhas - 1);
      }
      for (let y = 0; y < linhas; y++) {
        adicionar(0, y);
        adicionar(colunas - 1, y);
      }

      for (let i = 0; i < fila.length; i++) {
        const { x, y } = fila[i];
        adicionar(x + 1, y);
        adicionar(x - 1, y);
        adicionar(x, y + 1);
        adicionar(x, y - 1);
      }

      // Converte o rastro e as áreas fechadas em território.
      for (let y = 0; y < linhas; y++) {
        for (let x = 0; x < colunas; x++) {
          if (mapa[y][x] === 2 || (mapa[y][x] === 0 && !exterior[y][x])) {
            mapa[y][x] = 1;
          }
        }
      }

      rastro = [];

      const total = mapa.flat().filter(casa => casa === 1).length;
      statusEl.textContent =
        `Território: ${total} quadrados (${Math.floor(total / (colunas * linhas) * 100)}%)`;
    }

    function fimDeJogo() {
      acabou = true;
      statusEl.textContent = "Fim de jogo! Clique em Recomeçar para tentar de novo.";
      desenhar();
    }

    function desenhar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < linhas; y++) {
        for (let x = 0; x < colunas; x++) {
          if (mapa[y][x] === 1) ctx.fillStyle = "#32b86a";
          else if (mapa[y][x] === 2) ctx.fillStyle = "#ffcc4d";
          else ctx.fillStyle = "#172235";

          ctx.fillRect(
            x * tamanho, y * tamanho,
            tamanho - 1, tamanho - 1
          );
        }
      }

      // Jogador
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(
        jogador.x * tamanho + 3,
        jogador.y * tamanho + 3,
        tamanho - 6,
        tamanho - 6
      );
    }

    reiniciar();
  </script>
</body>
</html>
