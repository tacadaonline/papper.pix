<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper.io 360° Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #0c0c0e;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #painel {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 14px;
            background: rgba(12, 12, 14, 0.85);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .destaque { color: #00ffcc; font-weight: bold; }
        .pote { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="painel">
        <div>ID: <span id="meuId" class="destaque">-</span></div>
        <div>Saldo: <span id="saldo" class="destaque">R\$ 0,00</span></div>
        <div>💰 POTE: <span id="pote" class="pote">R\$ 0,00</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function redimensionarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionarCanvas);
        redimensionarCanvas();

        const local = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const wsUrl = local 
            ? 'ws://localhost:8080' 
            : window.location.origin.replace(/^http/, 'ws');
        
        const ws = new WebSocket(wsUrl);
        
        let meuId = null;
        let servidoresDados = { players: {}, pot: 0, mapSize: 3000 };
        let renderDados = { players: {} };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'init') {
                meuId = data.id;
                document.getElementById('meuId').innerText = meuId;
                document.getElementById('saldo').innerText = `R$ ${data.balance.toFixed(2)}`;
            }
            if (data.type === 'update') {
                servidoresDados = data.gameState;
                document.getElementById('pote').innerText = `R$ ${servidoresDados.pot.toFixed(2)}`;
            }
        };

        function gameLoop() {
            Object.keys(servidoresDados.players).forEach(id => {
                const sPlayer = servidoresDados.players[id];
                if (!renderDados.players[id]) {
                    renderDados.players[id] = { ...sPlayer };
                } else {
                    const rPlayer = renderDados.players[id];
                    rPlayer.x += (sPlayer.x - rPlayer.x) * 0.3; // Interpolação mais rápida para agilidade
                    rPlayer.y += (sPlayer.y - rPlayer.y) * 0.3;
                    rPlayer.color = sPlayer.color;
                    rPlayer.trail = sPlayer.trail;
                    rPlayer.alive = sPlayer.alive;
                }
            });

            Object.keys(renderDados.players).forEach(id => {
                if (!servidoresDados.players[id]) delete renderDados.players[id];
            });

            desenharJogo();
            requestAnimationFrame(gameLoop);
        }

        function desenharJogo() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const meuJogador = renderDados.players[meuId];
            let camX = servidoresDados.mapSize / 2 - canvas.width / 2;
            let camY = servidoresDados.mapSize / 2 - canvas.height / 2;

            if (meuJogador) {
                camX = meuJogador.x - canvas.width / 2;
                camY = meuJogador.y - canvas.height / 2;
            }

            ctx.save();
            ctx.translate(-camX, -camY);

            const MAP_SIZE = servidoresDados.mapSize || 3000;

            ctx.fillStyle = '#14141c';
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            ctx.lineWidth = 1;
            for (let x = 0; x <= MAP_SIZE; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= MAP_SIZE; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, MAP_SIZE); ctx.stroke();
            }

            ctx.strokeStyle = '#ff3344';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            Object.values(renderDados.players).forEach(player => {
                if (!player.alive) return;

                if (player.trail.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = player.color;
                    ctx.lineWidth = 12;
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = player.color;

                    player.trail.forEach((ponto, index) => {
                        if (index === 0) ctx.moveTo(ponto.x, ponto.y);
                        else ctx.lineTo(ponto.x, ponto.y);
                    });
                    ctx.stroke();
                    ctx.shadowBlur = 0; 
                }

                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.roundRect(player.x - 14, player.y - 14, 28, 28, 6);
                ctx.fill();

                if (player.id === meuId) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffffff';
                    ctx.beginPath();
                    ctx.roundRect(player.x - 16, player.y - 16, 32, 32, 8);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });

            ctx.restore();
        }

        // CONTROLE DO TECLADO (PC)
        window.addEventListener('keydown', (e) => {
            let dx = 0, dy = 0;
            if (e.key === 'ArrowUp' || e.key === 'w')    { dx = 0;  dy = -1; }
            if (e.key === 'ArrowDown' || e.key === 's')  { dx = 0;  dy = 1;  }
            if (e.key === 'ArrowLeft' || e.key === 'a')  { dx = -1; dy = 0;  }
            if (e.key === 'ArrowRight' || e.key === 'd') { dx = 1;  dy = 0;  }

            if (dx !== 0 || dy !== 0) EnviarMovimento(dx, dy);
        });

        // 🆕 NOVO CONTROLE TOQUE LIVRE (360 GRAUS PARA CELULAR)
        let touchId = null;
        let tStartX = 0;
        let tStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (touchId === null) {
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                tStartX = touch.clientX;
                tStartY = touch.clientY;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === touchId) {
                    const touch = e.touches[i];
                    
                    // Calcula a distância do arrasto em relação ao ponto inicial do toque
                    const diffX = touch.clientX - tStartX;
                    const diffY = touch.clientY - tStartY;
                    const dist = Math.hypot(diffX, diffY);

                    // Só move se o arrasto passar de uma pequena zona morta para evitar tremores
                    if (dist > 10) {
                        // Transforma a direção em um vetor unitário livre (valores decimais entre -1 e 1)
                        const dx = diffX / dist;
                        const dy = diffY / dist;
                        EnviarMovimento(dx, dy);
                    }
                }
            }
        }, { passive: none });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    touchId = null; // Libera para o próximo toque
                }
            }
        }, { passive: true });

        function EnviarMovimento(dx, dy) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'move', dx, dy }));
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
