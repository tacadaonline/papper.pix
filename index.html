<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cercado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
  <style>
    :root {
      --board: #e7ebf3;
      --grid: #d7ddea;
      --wall: #2a3348;
      --ink: #141a2a;
      --muted: #596177;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-line: rgba(20, 26, 42, 0.12);
      --scrim: rgba(231, 235, 243, 0.55);
      --halo: rgba(231, 235, 243, 0.92);
      --field: #ffffff;
      --accent: #2f6bff;
      --accent-ink: #ffffff;
      --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
      --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --board: #1a2033;
        --grid: #232b42;
        --wall: #0b0e18;
        --ink: #eef1f8;
        --muted: #9aa4bd;
        --panel: rgba(22, 27, 43, 0.84);
        --panel-line: rgba(255, 255, 255, 0.1);
        --scrim: rgba(8, 10, 18, 0.5);
        --halo: rgba(26, 32, 51, 0.9);
        --field: #10152a;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --board: #1a2033;
      --grid: #232b42;
      --wall: #0b0e18;
      --ink: #eef1f8;
      --muted: #9aa4bd;
      --panel: rgba(22, 27, 43, 0.84);
      --panel-line: rgba(255, 255, 255, 0.1);
      --scrim: rgba(8, 10, 18, 0.5);
      --halo: rgba(26, 32, 51, 0.9);
      --field: #10152a;
      color-scheme: dark;
    }

    html, body { height: 100%; }
    body {
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      background: var(--wall);
      color: var(--ink);
      font-family: var(--body);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
    }

    #cv {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      z-index: 0;
    }

    .hud {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-top: 12px;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 14px;
      padding: 10px 14px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      min-width: 0;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat .big {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(22px, 6vw, 30px);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .stat .sub {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
